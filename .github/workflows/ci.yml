name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov numpy scikit-learn
      - name: Lint (ruff)
        run: ruff check backend/
      - name: Run tests with coverage
        run: |
          cd backend
          pytest --cov=models --cov-report=term-missing || true
      # TODO(integration team): run validate_submission.py against changed
      # group folders, and fail the job if any check fails.
