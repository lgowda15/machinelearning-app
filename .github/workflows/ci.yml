name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history to diff against the PR base branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          pip install xgboost==2.0.3 hmmlearn shap==0.46.0
          # Deep-learning groups (3, 4, 7) need torch. Installed for every PR
          # for simplicity now rather than branching on which group changed.
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Lint (ruff)
        run: ruff check backend/

      - name: Run backend test suite
        run: |
          cd backend
          python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Reject changes outside the submitter's own group folder
        # Only enforced on fork PRs — that's how the 12 model groups submit.
        # Integration-team PRs come from branches on this repo (not a fork)
        # and legitimately touch shared files like this one.
        if: github.event.pull_request.head.repo.fork
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1
          OUTSIDE=$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" \
            | grep -v -E '^backend/models/group_[0-9]+_' || true)
          if [ -n "$OUTSIDE" ]; then
            echo "This PR touches files outside your group's own models/group_<NN>_<name>/ folder:"
            echo "$OUTSIDE"
            echo "Per Coding Standards Section 13, pull requests touching files outside your own folder are rejected."
            exit 1
          fi

      - name: Find changed group folder(s)
        id: changed
        run: |
          FOLDERS=$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" \
            -- 'backend/models/group_*' \
            | sed -E 's#(backend/models/group_[0-9]+_[^/]+)/.*#\1#' \
            | sort -u)
          if [ -z "$FOLDERS" ]; then
            echo "No backend/models/group_<NN>_<name>/ folder changed in this PR — nothing to validate."
          fi
          {
            echo "folders<<PR_FOLDERS_EOF"
            echo "$FOLDERS"
            echo "PR_FOLDERS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run validate_submission.py against each changed folder
        if: steps.changed.outputs.folders != ''
        run: |
          cd backend
          status=0
          while IFS= read -r folder; do
            [ -z "$folder" ] && continue
            relative="${folder#backend/}"
            echo "::group::validate_submission.py $relative"
            python validate_submission.py "$relative" || status=1
            echo "::endgroup::"
          done <<< "${{ steps.changed.outputs.folders }}"
          exit $status